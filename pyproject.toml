[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — undefined names, unused imports
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modern syntax
    "B",    # bugbear — likely bugs
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately touch internals and use long literal fixtures.
"tests/*" = ["E402", "RUF001"]
# RUF001 flags "ambiguous" unicode (en-dash, curly quotes) as probable typos.
# In the entity table those characters are the point — they are the expansions
# of &ndash;, &lsquo; and friends. Writing them as \u escapes would satisfy the
# rule but make the table unreadable, and the formatter normalizes them back to
# literals anyway.
"src/ingestion/loader.py" = ["RUF001"]
# report.py writes prose for a human reader, where an en-dash in a range is
# correct typography, not a typo.
"src/eval/report.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on unraised warnings rather than letting them accumulate unnoticed.
filterwarnings = ["error"]
